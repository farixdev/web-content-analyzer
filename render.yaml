services:
  - type: web
    name: web-content-analyzer
    env: python
    plan: free
    buildCommand: pip install -r requirements-web.txt
    startCommand: python web_server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DATABASE_URL
        sync: false
      - key: SERPER_API_KEY
        sync: false

